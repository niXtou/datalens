[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.1.0"
description = "Upload CSV, run ML analyses with LangGraph, stream results to React dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.47.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "langchain>=1.3.1",
    "langgraph>=0.0.1",
    "langsmith>=0.0.50",
    "python-multipart>=0.0.28",
    "langchain-openai>=1.2.1",
    "pydantic-settings>=2.14.1",
    "langchain-openrouter>=0.2.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_ai"]
