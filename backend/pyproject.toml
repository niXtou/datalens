[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.1.0"
description = "Upload CSV, run ML analyses with LangGraph, stream results to React dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "langchain>=1.4.3",
    "langgraph>=1.2.9",
    "langsmith>=0.14.3",
    "python-multipart>=0.0.32",
    "langchain-openai>=1.6.7",
    "pydantic-settings>=2.15.0",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_ai"]
