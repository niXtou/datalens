[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.1.0"
description = "Upload CSV, run ML analyses with LangGraph, stream results to React dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "pydantic>=2.13.4",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "langchain>=1.3.10",
    "langgraph>=1.2.6",
    "langsmith>=0.8.18",
    "python-multipart>=0.0.32",
    "langchain-openai>=1.3.2",
    "pydantic-settings>=2.14.2",
    "langchain-openrouter>=0.2.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_ai"]
