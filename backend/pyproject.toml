[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.1.0"
description = "Upload CSV, run ML analyses with LangGraph, stream results to React dashboard"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.14.3",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "langchain>=1.4.9",
    "langgraph>=1.2.9",
    "langsmith>=0.10.7",
    "python-multipart>=0.0.33",
    "langchain-openai>=1.7.4",
    "pydantic-settings>=2.16.2",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens_ai"]
