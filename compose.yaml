services:
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
    # Environment variables passed into the container. Our backend config.py reads ENVIRONMENT
    # and adjusts behavior (logging verbosity, error details, etc). Development = verbose output.
    environment:
      - ENVIRONMENT=development

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    # Two volumes: src/ changes appear live (JSX, components), and public/ changes (favicon, static assets).
    # If either changed outside the container, Vite dev server picks up the change instantly.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - api
